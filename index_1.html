<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chén Inox Xin Vía</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: một màn hình dọc kiểu vỉa hè Sài Gòn buổi tối — thanh tiền trên cùng, cảnh phố ở giữa, tủ đồ nâng cấp bên dưới */
:root{
  --asphalt:#1d2130; --wall:#2a3047; --tile:#3a3550;
  --lamp:#ffcf4a; --stool:#e8463c; --plastic:#2f86e8; --leaf:#47c27a;
  --cream:#fff6e3; --muted:#b9b4cc; --card:#262b3e; --line:#3a4060;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--asphalt);color:var(--cream);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 28px;-webkit-tap-highlight-color:transparent;user-select:none}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1;letter-spacing:.3px}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:.5px;margin-top:4px;text-transform:uppercase}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.85rem}
.wallet{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.money{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;color:var(--lamp);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.rate{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.title-chip{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.chip{background:var(--stool);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.75rem}
.bar{flex:1;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp);width:0;transition:width .3s}

.rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;
  background:repeating-linear-gradient(105deg, transparent 0 14px, rgba(170,200,255,.35) 14px 15px);background-size:40px 40px;animation:rain .35s linear infinite}
.scene.raining .rain{opacity:1}
@keyframes rain{to{background-position:-12px 40px}}

.passer{position:absolute;bottom:118px;font-size:42px;line-height:1;border:0;background:none;padding:4px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.4))}
.passer.walk{animation:bob .5s ease-in-out infinite alternate}
.passer.done{opacity:.45;pointer-events:none}
.passer .ask{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;font-family:var(--body);font-weight:700;background:var(--lamp);color:#2a2000;border-radius:8px;padding:1px 6px;white-space:nowrap}
@keyframes bob{to{translate:0 -4px}}

.beggar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:0;background:none;padding:0;width:150px;height:150px}
.beggar svg{width:100%;height:100%;overflow:visible}
.beggar:active svg{transform:scale(.95)}
.beggar.bump svg{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.07) rotate(-2deg)}}
.prop{position:absolute;bottom:22px;font-size:34px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));pointer-events:none}
.bubble{position:absolute;left:50%;bottom:168px;transform:translateX(-50%);max-width:82%;background:var(--cream);color:#2a2238;font-weight:700;font-size:.82rem;line-height:1.3;padding:7px 12px;border-radius:14px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.bubble.on{opacity:1}
.float{position:absolute;font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--lamp);text-shadow:0 2px 0 #000;pointer-events:none;animation:up 1s ease-out forwards;white-space:nowrap}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.combo{position:absolute;right:12px;top:12px;font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--stool);background:var(--cream);border-radius:10px;padding:2px 10px;opacity:0;transition:opacity .2s}
.combo.on{opacity:1}
.drop{position:absolute;top:-40px;font-size:30px;border:0;background:none;padding:4px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(400px) rotate(220deg)}}
.banner{position:absolute;left:12px;top:12px;max-width:65%;background:rgba(20,24,41,.85);border:1px solid var(--lamp);color:var(--cream);border-radius:12px;padding:6px 10px;font-size:.78rem;font-weight:600;line-height:1.3}
.banner b{color:var(--lamp)}
.hint{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:.7rem;color:var(--cream);text-shadow:0 1px 2px #000;pointer-events:none}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--plastic);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.item .ic{font-size:28px;text-align:center}
.item .nm{font-weight:700;font-size:.9rem;min-width:0}
.item .ds{font-size:.75rem;color:var(--muted);margin-top:2px}
.item .pr{font-family:var(--display);font-weight:800;color:var(--lamp);font-size:.95rem;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .lv{display:block;font-family:var(--body);font-weight:600;font-size:.7rem;color:var(--muted)}
.item:disabled{opacity:.45;cursor:not-allowed}
.item.buy{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.03)}}
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;max-height:280px;overflow:auto}
.log p{margin:0;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.82rem;line-height:1.4}
.log p:last-child{border:0}
.log time{color:var(--muted);font-size:.7rem;margin-right:6px;font-variant-numeric:tabular-nums}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.78rem;line-height:1.35}
.ach div b{display:block;font-size:.85rem;margin-bottom:2px}
.ach div.lock{opacity:.4}
.foot{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--cream);color:#2a2238;font-weight:700;font-size:.85rem;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm{display:flex;gap:8px;justify-content:center}
.confirm button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:.8rem}
.confirm .danger{background:var(--stool);border-color:var(--stool);color:#fff}
/* nhân vật chuyển động */
.b-body{transform-origin:75px 140px;animation:b-breathe 2.6s ease-in-out infinite}
@keyframes b-breathe{50%{transform:translateY(-1.5px) scaleY(1.02)}}
.b-head{transform-origin:75px 82px;animation:b-sway 5s ease-in-out infinite}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.beggar .b-eye{transform-box:fill-box;transform-origin:center;animation:b-blink 4.5s infinite}
@keyframes b-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.b-look{animation:b-look 9s ease-in-out infinite}
@keyframes b-look{0%,35%,100%{transform:translate(0,0)}42%,55%{transform:translate(-2.5px,.5px)}62%,75%{transform:translate(2.5px,.5px)}}
.b-hat{transform-origin:75px 46px}
.b-arms{transform-origin:75px 100px;animation:b-offer 1.8s ease-in-out infinite}
@keyframes b-offer{50%{transform:translateY(-2.5px) rotate(-3deg)}}
.b-eyes,.b-eyes-happy,.b-eyes-sleep,.b-mouth,.b-mouth-o,.b-mouth-sad,.b-mouth-sleep,.b-brows,.b-brows-sad,.b-tear{transition:opacity .15s}
.b-eyes-happy,.b-eyes-sleep,.b-mouth-o,.b-mouth-sad,.b-mouth-sleep,.b-brows-sad,.b-tear,.b-zzz text{opacity:0}
.beggar.happy .b-eyes,.beggar.happy .b-mouth{opacity:0}
.beggar.happy .b-eyes-happy,.beggar.happy .b-mouth-o{opacity:1}
.beggar.happy .b-arms{animation:b-shake .22s ease-in-out 4}
@keyframes b-shake{25%{transform:translateY(-6px) rotate(-6deg)}75%{transform:translateY(-6px) rotate(6deg)}}
.beggar.happy .b-hat{animation:b-hop .45s ease-out}
@keyframes b-hop{40%{transform:translateY(-7px) rotate(-6deg)}}
.beggar.happy .b-coins{animation:b-jingle .25s ease-out 3}
@keyframes b-jingle{50%{transform:translateY(-4px)}}
.beggar.sad .b-mouth,.beggar.sad .b-brows{opacity:0}
.beggar.sad .b-mouth-sad,.beggar.sad .b-brows-sad{opacity:1}
.beggar.sad .b-tear{animation:b-tear 1s ease-in infinite}
@keyframes b-tear{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(14px)}}
.beggar.sad .b-head{animation:none;transform:rotate(-6deg) translateY(2px);transition:transform .3s}
.beggar.sad .b-arms{animation:none;transform:translateY(3px)}
.beggar.sleepy .b-eyes,.beggar.sleepy .b-mouth{opacity:0}
.beggar.sleepy .b-eyes-sleep{opacity:1}
.beggar.sleepy .b-mouth-sleep{opacity:1;transform-box:fill-box;transform-origin:center;animation:b-snore 2.6s ease-in-out infinite}
@keyframes b-snore{50%{transform:scale(1.5)}}
.beggar.sleepy .b-head{animation:b-nod 2.6s ease-in-out infinite}
@keyframes b-nod{0%,100%{transform:rotate(4deg)}50%{transform:rotate(10deg) translateY(2px)}}
.beggar.sleepy .b-arms{animation:none;transform:translateY(3px) rotate(4deg)}
.beggar.sleepy .b-body{animation-duration:3.6s}
.beggar.sleepy .b-zzz text{animation:b-z 2.4s ease-out infinite}
.beggar.sleepy .b-zzz text:last-child{animation-delay:1.2s}
@keyframes b-z{0%{opacity:0;transform:translate(0,4px)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">Chén Inox Xin Vía<small>Game xin tiền ảo · 100% không có thật</small></div>
    <button class="iconbtn" id="mute" aria-label="Bật/tắt âm thanh">🔈 Âm</button>
  </header>

  <section class="wallet" aria-live="polite">
    <div class="money" id="money">0đ</div>
    <div class="rate"><span id="tapv">200đ</span>/lần xin<br><span id="ps">0đ</span>/giây</div>
    <div class="title-chip"><span class="chip" id="rank">Tập sự xin</span><span class="bar"><i id="rankbar"></i></span><span id="next"></span></div>
  </section>

  <section class="scene" id="scene" aria-label="Vỉa hè">
    <div class="rain"></div>
    <div class="combo" id="combo">x1</div>
    <div class="banner" id="banner" hidden></div>
    <div class="bubble" id="bubble"></div>
    <span class="prop" id="p-dog" style="left:calc(50% - 128px)" hidden>🐕</span>
    <span class="prop" id="p-guitar" style="left:calc(50% + 72px)" hidden>🎸</span>
    <span class="prop" id="p-loa" style="left:calc(50% + 106px);bottom:60px" hidden>📢</span>
    <span class="prop" id="p-phone" style="left:calc(50% - 92px);bottom:78px;font-size:28px" hidden>🤳</span>
    <button class="beggar" id="beggar" aria-label="Chìa chén xin tiền">
      <svg viewBox="0 0 150 150" aria-hidden="true">
        <ellipse cx="75" cy="142" rx="56" ry="7" fill="#000" opacity=".3"/>
        <rect x="42" y="112" width="66" height="10" rx="3" fill="#e8463c"/>
        <rect x="47" y="120" width="7" height="22" fill="#b8342c"/><rect x="96" y="120" width="7" height="22" fill="#b8342c"/>
        <g class="b-body">
          <path d="M48 116 Q46 80 75 78 Q104 80 102 116 Z" fill="#2f86e8"/>
          <path d="M66 80 L75 96 L84 80" fill="none" stroke="#1f5fae" stroke-width="3"/>
          <g class="b-head">
            <circle cx="75" cy="60" r="24" fill="#f5c79a"/>
            <g class="b-look"><g class="b-eyes">
              <g class="b-eye"><circle cx="66" cy="60" r="3.4" fill="#2a2238"/><circle cx="67.2" cy="58.8" r="1.1" fill="#fff"/></g>
              <g class="b-eye"><circle cx="84" cy="60" r="3.4" fill="#2a2238"/><circle cx="85.2" cy="58.8" r="1.1" fill="#fff"/></g>
            </g></g>
            <g class="b-eyes-happy" fill="none" stroke="#2a2238" stroke-width="2.4" stroke-linecap="round"><path d="M62 61 Q66 56 70 61"/><path d="M80 61 Q84 56 88 61"/></g>
            <g class="b-eyes-sleep" fill="none" stroke="#2a2238" stroke-width="2.2" stroke-linecap="round"><path d="M62 60 Q66 63 70 60"/><path d="M80 60 Q84 63 88 60"/></g>
            <ellipse cx="60" cy="68" rx="5" ry="3" fill="#f08a7a" opacity=".7"/><ellipse cx="90" cy="68" rx="5" ry="3" fill="#f08a7a" opacity=".7"/>
            <path class="b-mouth" d="M69 70 Q75 75 81 70" fill="none" stroke="#2a2238" stroke-width="2.4" stroke-linecap="round"/>
            <path class="b-mouth-o" d="M69.5 69 Q75 80 80.5 69 Z" fill="#8a2c3a" stroke="#2a2238" stroke-width="1.6" stroke-linejoin="round"/>
            <path class="b-mouth-sad" d="M69 74 Q75 68 81 74" fill="none" stroke="#2a2238" stroke-width="2.4" stroke-linecap="round"/>
            <ellipse class="b-mouth-sleep" cx="75" cy="72" rx="2.6" ry="2.2" fill="#2a2238"/>
            <g class="b-brows" stroke="#2a2238" stroke-width="2" fill="none" stroke-linecap="round"><path d="M62 52 Q66 49 70 52"/><path d="M80 52 Q84 49 88 52"/></g>
            <g class="b-brows-sad" stroke="#2a2238" stroke-width="2" fill="none" stroke-linecap="round"><path d="M62 54 L70 50"/><path d="M80 50 L88 54"/></g>
            <path class="b-tear" d="M63 64 q-2.6 4.4 0 6.4 q2.6 -2 0 -6.4z" fill="#7cc4ff"/>
            <g class="b-hat">
              <path d="M40 46 L75 14 L110 46 Q75 52 40 46 Z" fill="#e9cf8a" stroke="#c7a95e" stroke-width="2"/>
              <path d="M58 30 L92 30 M50 38 L100 38" stroke="#c7a95e" stroke-width="1.5"/>
            </g>
          </g>
          <g class="b-arms">
            <path d="M52 96 Q60 108 70 104" stroke="#f5c79a" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M98 96 Q90 108 80 104" stroke="#f5c79a" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M56 100 Q75 122 94 100 Z" fill="#cfd6e6" stroke="#8d97b0" stroke-width="2"/>
            <ellipse cx="75" cy="100" rx="19" ry="4" fill="#eef2fa" stroke="#8d97b0" stroke-width="2"/>
            <g class="b-coins"><circle cx="70" cy="99" r="2.6" fill="#ffcf4a"/><circle cx="79" cy="98.5" r="2.2" fill="#ffcf4a"/></g>
          </g>
        </g>
        <g class="b-zzz" fill="#fff6e3" stroke="#141829" stroke-width=".8" font-family="'Baloo 2',sans-serif" font-weight="800"><text x="100" y="36" font-size="12">z</text><text x="106" y="26" font-size="16">Z</text></g>
      </svg>
    </button>
    <div class="hint">Chạm chén để xin · Chạm người đi đường để xin trực tiếp</div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="shop">Sắm đồ nghề</button>
    <button role="tab" aria-selected="false" data-tab="log">Nhật ký</button>
    <button role="tab" aria-selected="false" data-tab="ach">Huy hiệu</button>
  </nav>
  <section id="tab-shop" class="list"></section>
  <section id="tab-log" class="log" hidden></section>
  <section id="tab-ach" class="ach" hidden></section>

  <div class="foot">
    Tiền trong game là tiền ảo, không nạp, không rút, không quy đổi.<br>
    <span id="resetwrap"><button class="iconbtn" id="reset" style="margin-top:8px">Chơi lại từ đầu</button></span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const BG=()=>document.getElementById('beggar');let moodT,lastAct=Date.now();
const mood=(m,ms)=>{const b=BG();lastAct=Date.now();b.classList.remove('happy','sad','sleepy');void b.getBoundingClientRect();if(m)b.classList.add(m);clearTimeout(moodT);if(m&&ms)moodT=setTimeout(()=>b.classList.remove(m),ms)};
const wake=()=>{lastAct=Date.now();BG().classList.remove('sleepy')};
setInterval(()=>{const b=BG();if(!b.classList.contains('sleepy')&&!b.classList.contains('happy')&&Date.now()-lastAct>15000){b.classList.remove('sad');b.classList.add('sleepy');try{say('Khò khò... chạm chén để đánh thức tui nha!')}catch(e){}}},1000);
const fmt=n=>{n=Math.floor(n);if(n>=1e9)return(n/1e9).toFixed(2).replace(/\.?0+$/,'')+' tỷ';if(n>=1e6)return(n/1e6).toFixed(2).replace(/\.?0+$/,'')+' triệu';return n.toLocaleString('vi-VN')+'đ'};
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

const UP=[
 {id:'chen',ic:'🥣',nm:'Chén inox bóng loáng',ds:'+200đ mỗi lần xin',cost:2000,tap:200},
 {id:'bien',ic:'🪧',nm:'Biển "Con chưa ăn sáng"',ds:'+1.000đ mỗi lần xin',cost:18000,tap:1000},
 {id:'dog',ic:'🐕',nm:'Chó Lu ngồi kế bên',ds:'Mắt long lanh, +300đ/giây',cost:5000,ps:300,prop:'p-dog'},
 {id:'guitar',ic:'🎸',nm:'Đàn guitar 3 dây',ds:'Đàn sai nốt vẫn có người cho, +1.500đ/giây',cost:40000,ps:1500,prop:'p-guitar'},
 {id:'cho',ic:'🛕',nm:'Chỗ ngồi trước chùa',ds:'Người đi ngang đông hơn',cost:60000,spawn:1},
 {id:'loa',ic:'📢',nm:'Loa kẹo kéo hát Bolero',ds:'"Đêm buồn tỉnh lẻ" bản phối remix, +6.000đ/giây',cost:220000,ps:6000,prop:'p-loa'},
 {id:'live',ic:'🤳',nm:'Livestream xin vía',ds:'Thả tim không ra tiền nhưng quà thì có, +30.000đ/giây',cost:1300000,ps:30000,prop:'p-phone'},
 {id:'mic',ic:'🎤',nm:'Micro không dây',ds:'Câu xin vang tới đầu hẻm, +8.000đ mỗi lần xin',cost:3500000,tap:8000},
 {id:'qr',ic:'🔳',nm:'Mã QR dán trên nón',ds:'Ting ting liên tục, +160.000đ/giây',cost:9000000,ps:160000},
 {id:'franchise',ic:'🏪',nm:'Nhượng quyền chén inox',ds:'Mở chi nhánh khắp 24 quận, +900.000đ/giây',cost:60000000,ps:900000},
];
const RANKS=[[0,'Tập sự xin'],[50000,'Xin có nghề'],[500000,'Ăn xin có bằng'],[5e6,'Trùm hẻm'],[5e7,'Đại gia ngầm'],[5e8,'Tỷ phú chén inox'],[5e9,'Huyền thoại vỉa hè']];
const ACH=[
 {id:'t1',nm:'Mở hàng',ds:'Xin lần đầu tiên',ok:s=>s.taps>=1},
 {id:'t500',nm:'Ngón tay vàng',ds:'Xin 500 lần',ok:s=>s.taps>=500},
 {id:'c20',nm:'Xin liên hoàn',ds:'Đạt combo x20',ok:s=>s.maxCombo>=20},
 {id:'p10',nm:'Ăn nói có duyên',ds:'Được 10 người đi đường cho',ok:s=>s.gifts>=10},
 {id:'rich',nm:'Gặp quý nhân',ds:'Được đại gia lì xì',ok:s=>s.rich>=1},
 {id:'bm',nm:'No bụng',ds:'Được cho 5 ổ bánh mì',ok:s=>s.food>=5},
 {id:'m1',nm:'Triệu phú vỉa hè',ds:'Tổng xin được 1 triệu',ok:s=>s.total>=1e6},
 {id:'m1b',nm:'Tỷ phú chén inox',ds:'Tổng xin được 1 tỷ',ok:s=>s.total>=1e9},
 {id:'all',nm:'Đủ bộ đồ nghề',ds:'Mua mỗi món ít nhất 1 lần',ok:s=>UP.every(u=>(s.lv[u.id]||0)>0)},
];
const BEG=['Cho con xin ít vía giàu đi cô ơi!','Anh đẹp trai ơi, cho em xin 1 like... à nhầm, 1 ngàn!','Hôm nay con mới ăn có 3 bữa à...','Cho xin ít tiền mua trà sữa full topping!','Lòng tốt của bạn sẽ được ghi vào sổ Nam Tào!','Có tiền lẻ hông? Tiền chẵn cũng nhận luôn!','Chén còn trống chỗ nè, mời quý khách!','Cho con xin để mua vé số đổi đời!','Tiền đâu, tiền đâu, mau vô chén!','Xin không phải vì nghèo, xin vì đam mê!','Cuối tháng rồi, ai cũng nghèo như nhau mà...'];
const GIVE=['Nè, cầm lấy mua bánh mì.','Thấy dễ thương nên cho nè.','Hôm nay chị trúng số, chia lộc!','Cho nè, nhớ cầu cho chị có bồ.','Thôi cho đó, đừng hát nữa!'];
const NO=['Tui còn nghèo hơn bạn nữa!','Để chuyển khoản nha... (đợi hoài không thấy ting ting)','Cuối tháng rồi em ơi.','Hông có tiền lẻ, chỉ có nợ.','Lườm một cái rồi đi thẳng.','Tui đang xin bên kia đường nè!','Đưa tui cái chén, tui xin chung!'];
const PEOPLE=['🚶','🚶‍♀️','👵','👴','🧑‍💼','👩‍🎓','🧑‍🍳','👷','💃','🧑‍🎤'];

const KEY='chen-inox-xin-via-v1';
let S={money:0,total:0,taps:0,gifts:0,rich:0,food:0,maxCombo:0,lv:{},ach:{},log:[],last:Date.now()};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
let noSave=false;const save=()=>{if(noSave)return;S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const cost=u=>Math.ceil(u.cost*Math.pow(1.17,S.lv[u.id]||0));
let mult=1, tapMult=1, buffT=0, buffName='';
const tapPower=()=>(200+UP.reduce((a,u)=>a+(u.tap||0)*(S.lv[u.id]||0),0))*tapMult*mult;
const perSec=()=>UP.reduce((a,u)=>a+(u.ps||0)*(S.lv[u.id]||0),0)*mult;
const earn=n=>{S.money+=n;S.total+=n};

/* audio */
let AC=null, muted=false;try{muted=localStorage.getItem(KEY+'-mute')==='1'}catch(e){}
const blip=(f=880,d=.08,type='square',v=.05)=>{if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const coin=()=>{blip(988,.06);setTimeout(()=>blip(1319,.12),60)};
const muteBtn=$('#mute');const setMute=()=>muteBtn.textContent=muted?'🔇 Tắt':'🔈 Âm';setMute();
muteBtn.onclick=()=>{muted=!muted;setMute();try{localStorage.setItem(KEY+'-mute',muted?'1':'0')}catch(e){}};

/* ui helpers */
const scene=$('#scene');
const float=(txt,x,y,color)=>{const el=document.createElement('div');el.className='float';el.textContent=txt;el.style.left=x+'px';el.style.top=y+'px';if(color)el.style.color=color;scene.appendChild(el);setTimeout(()=>el.remove(),1000)};
let bubT;const say=t=>{const b=$('#bubble');b.textContent=t;b.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove('on'),1800)};
let toastT;const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)};
const log=t=>{const d=new Date();S.log.unshift([d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'),t]);S.log=S.log.slice(0,40);if(tab==='log')renderLog()};

/* tap the bowl */
let combo=0, lastTap=0, comboT;
$('#beggar').addEventListener('click',e=>{
  const now=performance.now();combo=(now-lastTap<650)?combo+1:1;lastTap=now;S.maxCombo=Math.max(S.maxCombo,combo);
  const cm=1+Math.min(combo,40)*0.05;const v=tapPower()*cm;earn(v);S.taps++;
  const r=scene.getBoundingClientRect();const x=(e.clientX||r.left+r.width/2)-r.left-30, y=(e.clientY||r.top+r.height-120)-r.top-30;
  float('+'+fmt(v),x+rnd(-20,20),y);coin();
  const bg=$('#beggar');bg.classList.remove('bump');void bg.offsetWidth;bg.classList.add('bump');mood('happy',450);
  if(S.taps%6===1)say(pick(BEG));
  const c=$('#combo');if(combo>=3){c.textContent='Combo x'+combo;c.classList.add('on')}
  clearTimeout(comboT);comboT=setTimeout(()=>{c.classList.remove('on');combo=0},700);
  render();
});

/* passersby */
let spawnT=0;
function spawnPasser(){
  const p=document.createElement('button');p.className='passer walk';p.textContent=pick(PEOPLE);p.setAttribute('aria-label','Người đi đường');
  const w=scene.clientWidth, dur=rnd(6,9)*1000, rtl=Math.random()<.5;
  const ask=document.createElement('span');ask.className='ask';ask.textContent='Xin!';p.appendChild(ask);
  if(!rtl)p.style.transform='scaleX(-1)',ask.style.transform='translateX(-50%) scaleX(-1)';
  scene.appendChild(p);
  const from=rtl?w+10:-60, to=rtl?-60:w+10;
  const anim=p.animate([{left:from+'px'},{left:to+'px'}],{duration:dur,easing:'linear'});
  anim.onfinish=()=>p.remove();
  p.addEventListener('click',ev=>{ev.stopPropagation();if(p.classList.contains('done'))return;p.classList.add('done');ask.remove();askPerson(p)});
}
function askPerson(p){
  const r=scene.getBoundingClientRect(), pr=p.getBoundingClientRect();const x=pr.left-r.left, y=pr.top-r.top-10;
  const roll=Math.random();const base=tapPower()+perSec()*2;
  if(roll<.04){const v=base*rnd(40,80);earn(v);S.rich++;S.gifts++;mood('happy',1600);float('+'+fmt(v),x,y,'#47c27a');say('Đại gia: "Cầm hết đi em, anh dư!"');log('Gặp đại gia lì xì '+fmt(v)+'. Quý nhân phù trợ!');blip(523,.1);setTimeout(()=>blip(659,.1),100);setTimeout(()=>blip(784,.2),200)}
  else if(roll<.5){const v=base*rnd(3,9);earn(v);S.gifts++;mood('happy',900);float('+'+fmt(v),x,y);say(pick(GIVE));coin();if(Math.random()<.25)log('Người đi đường cho '+fmt(v)+'.')}
  else if(roll<.66){S.food++;S.gifts++;mood('happy',1200);const item=pick(['🥖 ổ bánh mì','🧋 ly trà sữa','🍌 nải chuối','🍚 hộp cơm tấm']);float(item.split(' ')[0],x,y);say('Được cho '+item.slice(3)+'! No bụng xin hăng gấp đôi.');buff('No bụng: tiền mỗi lần xin x2',10,1,2);log('Được cho '+item.slice(3)+'. Xin hăng gấp đôi 10 giây.');blip(660,.12,'triangle')}
  else{mood('sad',1500);float(pick(['😒','🙄','💸?','😅']),x,y,'#b9b4cc');say(pick(NO));blip(220,.15,'sawtooth',.03)}
  render();
}

/* buffs & events */
let bannerT;
function buff(name,sec,m,tm){mult=m;tapMult=tm;buffT=sec;buffName=name;const b=$('#banner');b.innerHTML='<b>'+name.split(':')[0]+'</b>'+(name.includes(':')?':'+name.split(':').slice(1).join(':'):'')+' <span id="bt"></span>';b.hidden=false}
function clearBuff(){mult=1;tapMult=1;buffName='';$('#banner').hidden=true;scene.classList.remove('raining')}
function dropRain(n,valueFn,icons){for(let i=0;i<n;i++)setTimeout(()=>{const d=document.createElement('button');d.className='drop';d.textContent=pick(icons);d.setAttribute('aria-label','Nhặt tiền');d.style.left=rnd(10,scene.clientWidth-50)+'px';d.style.animationDuration=rnd(2.6,4)+'s';scene.appendChild(d);d.addEventListener('animationend',()=>d.remove());d.addEventListener('click',ev=>{ev.stopPropagation();const v=valueFn();earn(v);const r=scene.getBoundingClientRect();float('+'+fmt(v),ev.clientX-r.left-20,ev.clientY-r.top-20);coin();d.remove();render()})},i*rnd(150,380))}
const EVENTS=[
 ()=>{buff('Mưa rào: người ta chạy hết, thu nhập x0,5',15,.5,1);scene.classList.add('raining');log('Mưa rào bất chợt. Kéo ghế vô mái hiên tạp hóa Cô Ba.')},
 ()=>{buff('Ngày rằm: lòng người rộng mở, mọi thu nhập x3',20,3,1);log('Hôm nay ngày rằm, ai đi chùa về cũng dễ thương.')},
 ()=>{buff('Đám cưới đi ngang: chạm phong bao để nhặt!',8,1,1);dropRain(14,()=>(tapPower()+perSec())*rnd(2,5),['🧧','💵','🪙']);log('Đám cưới đi ngang, nhà trai rải lì xì.')},
 ()=>{buff('Dì vé số giành chỗ: tiền mỗi lần xin x0,5',10,1,.5);log('Dì vé số tới giành chỗ. Mua giùm dì một tờ cho êm.')},
 ()=>{buff('Gió thổi bay tiền: nhặt lẹ!',7,1,1);dropRain(10,()=>(tapPower()+perSec())*rnd(1,3),['💵','🪙']);log('Gió lớn thổi tiền ai đó bay tới. Nhặt được thì của mình (trong game thôi nha).')},
 ()=>{buff('Hot trend TikTok: clip bạn lên xu hướng, thu nhập x2',20,2,1);log('Có người quay clip bạn hát Bolero, lên xu hướng!')},
];
let eventIn=rnd(25,40);

/* shop */
let tab='shop';
function renderShop(){const box=$('#tab-shop');box.innerHTML='';UP.forEach((u,i)=>{
  const lv=S.lv[u.id]||0;const prev=i?UP[i-1]:null;if(prev&&!(S.lv[prev.id]>0)&&S.total<u.cost*.5&&lv===0)return;
  const b=document.createElement('button');b.className='item';b.id='up-'+u.id;b.dataset.id=u.id;
  b.innerHTML='<span class="ic">'+u.ic+'</span><span><span class="nm">'+u.nm+'</span><div class="ds">'+u.ds+'</div></span><span class="pr">'+fmt(cost(u))+'<span class="lv">'+(u.spawn?'Cấp '+lv+'/5':'Đã có '+lv)+'</span></span>';
  b.onclick=()=>buy(u,b);box.appendChild(b)});updateShop()}
function updateShop(){UP.forEach(u=>{const b=document.getElementById('up-'+u.id);if(!b)return;b.disabled=S.money<cost(u)||(u.spawn&&(S.lv[u.id]||0)>=5)})}
function buy(u,b){wake();const c=cost(u);if(S.money<c)return;S.money-=c;S.lv[u.id]=(S.lv[u.id]||0)+1;blip(523,.08,'triangle');setTimeout(()=>blip(784,.12,'triangle'),80);
  if(S.lv[u.id]===1){log('Sắm '+u.nm+'.');toast('Đã sắm: '+u.nm)}
  renderShop();const nb=document.getElementById('up-'+u.id);if(nb){nb.classList.add('buy')}render()}
function renderLog(){const box=$('#tab-log');box.innerHTML=S.log.length?S.log.map(([t,x])=>'<p><time>'+t+'</time>'+x+'</p>').join(''):'<p>Chưa có gì. Chìa chén ra xin thử đi!</p>'}
function renderAch(){$('#tab-ach').innerHTML=ACH.map(a=>'<div class="'+(S.ach[a.id]?'':'lock')+'"><b>'+(S.ach[a.id]?'🏅 ':'🔒 ')+a.nm+'</b>'+a.ds+'</div>').join('')}
document.querySelectorAll('.tabs button').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===t));['shop','log','ach'].forEach(k=>$('#tab-'+k).hidden=k!==tab);if(tab==='shop')renderShop();if(tab==='log')renderLog();if(tab==='ach')renderAch()});

/* main render */
let shopCount=0;
function render(){
  $('#money').textContent=fmt(S.money);$('#tapv').textContent=fmt(tapPower());$('#ps').textContent=fmt(perSec());
  let i=0;while(i<RANKS.length-1&&S.total>=RANKS[i+1][0])i++;$('#rank').textContent=RANKS[i][1];
  if(i<RANKS.length-1){const a=RANKS[i][0],b=RANKS[i+1][0];$('#rankbar').style.width=Math.min(100,(S.total-a)/(b-a)*100)+'%';$('#next').textContent='→ '+RANKS[i+1][1]}else{$('#rankbar').style.width='100%';$('#next').textContent='Max!'}
  UP.forEach(u=>{if(u.prop)document.getElementById(u.prop).hidden=!(S.lv[u.id]>0)});
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.ok(S)){S.ach[a.id]=1;toast('Huy hiệu mới: '+a.nm);log('Mở khóa huy hiệu "'+a.nm+'".');if(tab==='ach')renderAch()}});
  const vis=UP.filter((u,idx)=>{const prev=idx?UP[idx-1]:null;return !(prev&&!(S.lv[prev.id]>0)&&S.total<u.cost*.5&&!(S.lv[u.id]>0))}).length;
  if(vis!==shopCount){shopCount=vis;if(tab==='shop')renderShop()}
  if(tab==='shop')updateShop();
}

/* offline earnings */
const away=Math.min((Date.now()-S.last)/1000,7200);
if(away>30&&perSec()>0){const v=perSec()*away*.5;earn(v);setTimeout(()=>toast('Lúc bạn đi vắng, Chó Lu xin giùm được '+fmt(v)),600);log('Đi vắng '+Math.round(away/60)+' phút, đồ nghề tự xin được '+fmt(v)+'.')}
if(!S.log.length)log('Ra vỉa hè trước tạp hóa Cô Ba, kê ghế nhựa, chìa chén. Bắt đầu sự nghiệp!');

/* loop */
let last=performance.now(), acc=0;
function tick(now){const dt=Math.min((now-last)/1000,1);last=now;
  earn(perSec()*dt);
  if(buffT>0){buffT-=dt;const bt=document.getElementById('bt');if(bt)bt.textContent='('+Math.ceil(buffT)+'s)';if(buffT<=0)clearBuff()}
  spawnT-=dt;if(spawnT<=0){spawnPasser();spawnT=rnd(2.2,4.2)/(1+(S.lv.cho||0)*.35)}
  eventIn-=dt;if(eventIn<=0&&buffT<=0){pick(EVENTS)();eventIn=rnd(30,50)}
  acc+=dt;if(acc>.25){acc=0;render()}
  requestAnimationFrame(tick)}
renderShop();render();requestAnimationFrame(tick);
setInterval(save,4000);addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* reset with in-page confirm */
const wrap=$('#resetwrap');
function bindReset(){$('#reset').onclick=()=>{wrap.innerHTML='<div class="confirm" style="margin-top:8px"><span style="align-self:center">Xóa hết tiền ảo?</span><button class="danger" id="yes">Xóa</button><button id="no">Thôi</button></div>';
  $('#yes').onclick=()=>{noSave=true;try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
  $('#no').onclick=()=>{wrap.innerHTML='<button class="iconbtn" id="reset" style="margin-top:8px">Chơi lại từ đầu</button>';bindReset()}}}
bindReset();
})();
</script>
